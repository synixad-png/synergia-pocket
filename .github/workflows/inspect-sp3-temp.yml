name: TEMP SP3 Public Page Inspection
on:
  push:
    branches: [feature/sp3-canteen-20261104]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public canteen page HTML (no secrets)
        run: |
          python - <<'PY'
          import urllib.request,re
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__();self.tags=[];self.now=[];self.items=[]
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t in ('img','a','iframe','source'):
                      self.items.append((t,{k:str(v)[:150] for k,v in d.items() if k in ('src','href','alt','title','data-src')}))
                  if t in ('h1','h2','h3','h4'):self.now.append([t,''])
              def handle_data(self,s):
                  if self.now:self.now[-1][1]+=s
              def handle_endtag(self,t):
                  if self.now and t==self.now[-1][0]: self.tags.append(self.now.pop())
          for url in ['https://sp3wroc.edupage.org/a/stolowka','https://sp3wroc.edupage.org/news/']:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; SynergiaPocket/1.0)'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      payload=r.read(1200000);print('URL',r.url,'STATUS',r.status,'SIZE',len(payload),'CT',r.headers.get('Content-Type'))
                  page=payload.decode('utf-8','replace');p=P();p.feed(page)
                  print('HEADINGS',p.tags[:35])
                  print('MEDIA_AND_LINKS',p.items[:60])
                  print('NEAR MENU')
                  for match in list(re.finditer(r'jad.{0,3}ospis|sto.{0,3}wka|obiad|2026|2027|pliki_do_pobrania|pobierz',page,re.I))[:30]:
                      print(re.sub(r'\\s+',' ',page[max(0,match.start()-110):match.end()+180])[:340])
              except Exception as e:
                  print('FETCH_FAILED',type(e).__name__,str(e)[:250])
          PY