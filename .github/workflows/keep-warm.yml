name: Synergia Pocket — dzienne podtrzymanie serwera

on:
  schedule:
    # Dni robocze 07:03–17:53 czasu polskiego. 10 min odstepu.
    # Ograniczamy zuzycie minut w PRYWATNYM repo GitHub Free.
    - cron: '3,13,23,33,43,53 7-17 * * 1-5'
      timezone: Europe/Warsaw
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synergia-pocket-keep-warm
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping publicznego health check (bez danych Librusa)
        run: |
          curl --fail --silent --show-error --location \
            --retry 0 --max-time 100 \
            --user-agent 'Synergia-Pocket-Health/1.0' \
            --output /dev/null \
            'https://synergia-pocket.onrender.com/api/health'
