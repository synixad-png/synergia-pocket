name: Synergia Direct — v0.31 P28 unsigned IPA (Intel)
on:
  push:
    branches:
      - ci/synergia-direct-ipa-20261105
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack exact Synergia Direct P28 source archive
        shell: bash
        run: |
          set -euo pipefail
          echo "040d334503872819e53d192c869464fc0eb48b1261e9b1da7ed8f4ff83203d61  ci/SYNERGIA_DIRECT_v031_P28_XCODE_FIX_PELNE_ZRODLA.zip" | shasum -a 256 -c -
          unzip -tq "ci/SYNERGIA_DIRECT_v031_P28_XCODE_FIX_PELNE_ZRODLA.zip"
          mkdir -p synergia-direct-ios
          unzip -q "ci/SYNERGIA_DIRECT_v031_P28_XCODE_FIX_PELNE_ZRODLA.zip" -d synergia-direct-ios
          test -f synergia-direct-ios/project.yml
          test -f synergia-direct-ios/Sources/SynergiaDirectApp.swift
          test -f synergia-direct-ios/Sources/DirectAttendanceStatistics.swift
          test -f synergia-direct-ios/RAPORT_PAKIET_28_STATUSY_FREKWENCJI.md
          test -f synergia-direct-ios/RAPORT_CI_P28_KOMPILACJA.md
          grep -q 'private func runCoreSync' synergia-direct-ios/Sources/Portal.swift
          grep -q 'self.directory = base.appendingPathComponent' synergia-direct-ios/Sources/LocalStore.swift
          echo 'Verified COMPLETE SYNERGIA DIRECT P28 + Xcode fixes. No P18 source substitutions.'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project from P28
        working-directory: synergia-direct-ios
        run: xcodegen generate
      - name: Build unsigned iPhone IPA application
        working-directory: synergia-direct-ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project SynergiaDirect.xcodeproj -scheme SynergiaDirect -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned P28 IPA
        working-directory: synergia-direct-ios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SynergiaDirect.app Payload/
          zip -qr SYNERGIA_DIRECT_v031_P28_UNSIGNED.ipa Payload
          unzip -tq SYNERGIA_DIRECT_v031_P28_UNSIGNED.ipa
          shasum -a 256 SYNERGIA_DIRECT_v031_P28_UNSIGNED.ipa
      - name: Upload P28 IPA
        uses: actions/upload-artifact@v4
        with:
          name: SYNERGIA_DIRECT_v031_P28_UNSIGNED_IPA
          path: synergia-direct-ios/SYNERGIA_DIRECT_v031_P28_UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 14
