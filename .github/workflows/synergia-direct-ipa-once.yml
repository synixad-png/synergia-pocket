          zip -qr SYNERGIA_DIRECT_v031_P29_UNSIGNED.ipa Payload
          unzip -tq SYNERGIA_DIRECT_v031_P29_UNSIGNED.ipa
          shasum -a 256 SYNERGIA_DIRECT_v031_P29_UNSIGNED.ipa
      - name: Upload P29 IPA
