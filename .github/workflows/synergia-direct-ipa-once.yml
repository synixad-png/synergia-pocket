      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project from P29
        working-directory: synergia-direct-ios
        run: xcodegen generate
      - name: Build unsigned iPhone IPA application
        working-directory: synergia-direct-ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project SynergiaDirect.xcodeproj -scheme SynergiaDirect -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
