          +        let bytes = Array(suffix)
          +        guard bytes.count >= 6, bytes[0] == 84 || bytes[0] == 32 else { return false }
          +        func number(_ start: Int, _ count: Int) -> Int? {
          +            guard start + count <= bytes.count else { return nil }
          +            var value = 0
          +            for index in start..<(start + count) {
          +                let byte = bytes[index]
          +                guard (48...57).contains(byte) else { return nil }
          +                value = value * 10 + Int(byte - 48)
          +            }
          +            return value
          +        }
          +        guard bytes[3] == 58, let hour = number(1, 2), hour < 24,
          +              let minute = number(4, 2), minute < 60 else { return false }
          +        var position = 6
          +        var hasSeconds = false
          +        if position < bytes.count && bytes[position] == 58 {
          +            position += 1
          +            guard let second = number(position, 2), second < 60 else { return false }
