          +            guard hasSeconds else { return false }
          +            position += 1
          +            let first = position
          +            while position < bytes.count && (48...57).contains(bytes[position]) { position += 1 }
          +            guard position > first else { return false }
          +        }
          +        if position == bytes.count { return true }
          +        if bytes[position] == 90 { return position + 1 == bytes.count } // UTC Z
          +        if bytes[position] == 43 || bytes[position] == 45 {
          +            guard position + 6 == bytes.count, bytes[position + 3] == 58,
