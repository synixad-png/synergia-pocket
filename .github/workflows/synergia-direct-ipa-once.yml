      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project from P30
        working-directory: synergia-direct-ios
        run: xcodegen generate
      - name: Build unsigned iPhone IPA application
        working-directory: synergia-direct-ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project SynergiaDirect.xcodeproj -scheme SynergiaDirect -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned P30 IPA
        working-directory: synergia-direct-ios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SynergiaDirect.app Payload/
          zip -qr SYNERGIA_DIRECT_v031_P30_UNSIGNED.ipa Payload
          unzip -tq SYNERGIA_DIRECT_v031_P30_UNSIGNED.ipa
          shasum -a 256 SYNERGIA_DIRECT_v031_P30_UNSIGNED.ipa
      - name: Upload P30 IPA
        uses: actions/upload-artifact@v4
        with:
          name: SYNERGIA_DIRECT_v031_P30_UNSIGNED_IPA
          path: synergia-direct-ios/SYNERGIA_DIRECT_v031_P30_UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 14
