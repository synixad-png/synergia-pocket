name: SYNERGIA DIRECT v0.31 P58 — current official in-app login unsigned IPA
on:
  push:
    branches:
      - ci/synergia-direct-p58-login-20261106
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify original P52 Swift source archive
        shell: bash
        run: |
          set -euo pipefail
          echo '6c92bc209c23f092d2e8bd930af1cec3ecbdb1bc23299525da99d7c9b041247b  ci/SYNERGIA_DIRECT_P52_MACOS_BUILD_SOURCE.zip' | shasum -a 256 -c -
          unzip -tq ci/SYNERGIA_DIRECT_P52_MACOS_BUILD_SOURCE.zip
          mkdir -p synergia-direct-ios
          unzip -q ci/SYNERGIA_DIRECT_P52_MACOS_BUILD_SOURCE.zip -d synergia-direct-ios
          test -f synergia-direct-ios/project.yml
          test -f synergia-direct-ios/Sources/SynergiaDirectApp.swift
          test "$(find synergia-direct-ios/Sources -maxdepth 1 -type f -name '*.swift' | wc -l | tr -d ' ')" -eq 107
      - name: Apply verified SwiftUI compile fixes (P53)
        run: python3 ci/patch_p52_xcode.py synergia-direct-ios/Sources/MainView.swift
      - name: Apply native iPhone/iPad adaptive navigation changes (P54)
        run: python3 ci/patch_p54_navigation.py synergia-direct-ios/Sources/MainView.swift
      - name: Apply iPad detail path identity fix (P55)
        run: python3 ci/patch_p55_detail_navigation.py synergia-direct-ios/Sources/MainView.swift
      - name: Apply explicit in-app account switch UI (P56)
        run: python3 ci/patch_p56_account_switch.py synergia-direct-ios/Sources/MainView.swift
      - name: Apply account privacy and login guard (P57)
        run: python3 ci/patch_p57_account_privacy.py synergia-direct-ios/Sources/MainView.swift
      - name: Apply P58 live official in-app login and secure TLS diagnostics
        shell: bash
        run: |
          set -euo pipefail
          gzip -cd ci/p58_official_login.patch.gz | patch -p1 -d synergia-direct-ios
          cd synergia-direct-ios
          printf '%b\n' 'ecf1e6c27aede6cad4abe27928fd9be9d0403dfa1f7f66bc9ede6d1f21702080  Sources/MainView.swift\n9859ccf0246907e11e93a73d43515320459b3dabe973ee8ada0b948d4d4f44eb  Sources/Portal.swift\n0a20353ed5c0730edb02fa7ef2856346367f85b0269d6f53080b472b39987e3e  Sources/NativeSchoolLoginPolicy.swift\nae44e824b5761bcba583ba4429d6318bd3338eac1472a67fb96fc98616433b08  Sources/DirectSynergiaEntry.swift' | shasum -a 256 -c -
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS device app without signing
        working-directory: synergia-direct-ios
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project SynergiaDirect.xcodeproj -scheme SynergiaDirect -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild.log
      - name: Pack and test unsigned IPA
        working-directory: synergia-direct-ios
        shell: bash
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/SynergiaDirect.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SynergiaDirect.app Payload/
          zip -qry SYNERGIA_DIRECT_v0_31_P58_UNSIGNED.ipa Payload
          unzip -tq SYNERGIA_DIRECT_v0_31_P58_UNSIGNED.ipa
          shasum -a 256 SYNERGIA_DIRECT_v0_31_P58_UNSIGNED.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SYNERGIA_DIRECT_v0_31_P58_UNSIGNED_IPA
          path: synergia-direct-ios/SYNERGIA_DIRECT_v0_31_P58_UNSIGNED.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SYNERGIA_DIRECT_P58_XCODE_LOG
          path: synergia-direct-ios/xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore
