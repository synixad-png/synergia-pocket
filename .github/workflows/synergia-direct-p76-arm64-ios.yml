      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS device app without signing
        working-directory: synergia-direct-ios
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project SynergiaDirect.xcodeproj -scheme SynergiaDirect -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild.log
      - name: Pack and test unsigned IPA
        working-directory: synergia-direct-ios
        shell: bash
        run: |
          set -euo pipefail
          test -d build/Build/Products/Release-iphoneos/SynergiaDirect.app
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SynergiaDirect.app Payload/
          zip -qry SYNERGIA_DIRECT_v0_31_P76_UNSIGNED.ipa Payload
          unzip -tq SYNERGIA_DIRECT_v0_31_P76_UNSIGNED.ipa
          shasum -a 256 SYNERGIA_DIRECT_v0_31_P76_UNSIGNED.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SYNERGIA_DIRECT_v0_31_P76_UNSIGNED_IPA
          path: synergia-direct-ios/SYNERGIA_DIRECT_v0_31_P76_UNSIGNED.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SYNERGIA_DIRECT_P76_XCODE_LOG
          path: synergia-direct-ios/xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore
