name: SYNERGIA DIRECT — safe real-login diagnostics
on:
  push:
    branches:
      - ci/synergia-private-login-test-20261106
  workflow_dispatch:
    inputs:
      confirm_account_owner:
        description: 'I own or am authorized to test the account'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  public-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract and verify privacy-sensitive test harness
        shell: bash
        run: |
          set -euo pipefail
          echo 'e61225cc2d2ac9b7ccaca7d8e19c717466a57915c160852ee5605f35049f4a47  ci/synergia_private_login_tests.tar.gz' | sha256sum -c -
          tar -xzf ci/synergia_private_login_tests.tar.gz -C ci
      - name: Check test safety without private credentials
        run: python3 -m unittest discover -s ci -p 'test_synergia_login_smoke.py' -v
      - name: Check official public login TLS and redirect without account
        run: python3 ci/synergia_login_smoke.py preflight
  private-e2e:
    # Private login is never run on ordinary pushes or pull requests.
    # A deliberately named one-time commit on this branch is required.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_account_owner == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/ci/synergia-private-login-test-20261106' && github.event.head_commit.message == 'RUN_AUTHORIZED_SYNERGIA_E2E_ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract and verify privacy-sensitive test harness
        shell: bash
        run: |
          set -euo pipefail
          echo 'e61225cc2d2ac9b7ccaca7d8e19c717466a57915c160852ee5605f35049f4a47  ci/synergia_private_login_tests.tar.gz' | sha256sum -c -
          tar -xzf ci/synergia_private_login_tests.tar.gz -C ci
      - name: Install WebKit headless test browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps webkit
      - name: Verify one LIVE login and /Me without saving personal data
        env:
          SYNERGIA_TEST_LOGIN: ${{ secrets.SYNERGIA_TEST_LOGIN }}
          SYNERGIA_TEST_PASSWORD: ${{ secrets.SYNERGIA_TEST_PASSWORD }}
        shell: bash
        run: |
          set +x
          python3 ci/synergia_login_smoke.py live

  anonymous-webkit-flow:
    # Browser-based form-route checks only. No credentials, screenshots or profile data.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser engine
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps webkit
      - name: Trace official login entry and presence of password form (anonymous)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          targets=[
            ("school-entry","https://synergia.librus.pl/loguj/portalRodzina"),
            ("portal-school-entry","https://portal.librus.pl/rodzina/synergia/loguj"),
            ("portal-landing","https://portal.librus.pl/rodzina"),
            ("legacy-login","https://www.librus.com.pl/"),
          ]
          def hostpath(url):
              s=urlsplit(url)
              return (s.hostname or "<no-host>")+(s.path or "/")
          with sync_playwright() as playwright:
              browser=playwright.webkit.launch(headless=True)
              for label,url in targets:
                  context=browser.new_context(locale="pl-PL")
                  page=context.new_page()
                  try:
                      resp=page.goto(url,wait_until="domcontentloaded",timeout=30000)
                      page.wait_for_timeout(1800)
                      print("CHECK",label,"status",resp.status if resp else "none",
                            "url",hostpath(page.url),
                            "password_fields",page.locator('input[type="password"]').count(),
                            "forms",page.locator("form").count())
                      if label=="portal-landing":
                          print("PORTAL_LINKS")
                          for link in page.locator("a[href]").all()[:180]:
                              try:
                                  name=" ".join(link.inner_text(timeout=250).split())[:70]
                                  href=link.get_attribute("href") or ""
                                  if "synergia" in name.lower() or "zaloguj" in name.lower() or "synergia" in href.lower() or "loguj" in href.lower():
                                      print("LINK",repr(name),hostpath(page.url if href.startswith("#") else href if href.startswith("https://") else page.url))
                              except Exception:
                                  pass
                  except Exception as exc:
                      print("CHECK",label,"ERROR",type(exc).__name__)
                  finally:
                      context.close()
              browser.close()
          PY

      - name: Follow visible Synergia menu to actual school login (anonymous)
        shell: bash
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlsplit
          def safeurl(url):
              x=urlsplit(url)
              return f"{x.hostname}{x.path}"
          with sync_playwright() as p:
              b=p.webkit.launch(headless=True)
              page=b.new_page(locale="pl-PL",viewport={"width":1320,"height":820})
              page.goto("https://portal.librus.pl/rodzina",wait_until="domcontentloaded",timeout=30000)
              page.wait_for_timeout(4500)
              print("START",safeurl(page.url))
              matches=[]
              for el in page.locator('button,a,[role="button"]').all():
                  try:
                      s=" ".join(el.inner_text(timeout=150).strip().split())[:80]
                      if ("synergia" in s.lower() or "zaloguj" in s.lower()) and s:
                          matches.append((s,el.get_attribute("href") or "",el.is_visible(timeout=150)))
                  except Exception:
                      pass
              print("MENU_ITEMS",len(matches))
              for name,href,visible in matches[:18]:
                  print("ITEM",repr(name),"href",safeurl(href) if href.startswith("https://") else "<relative-or-none>","visible",visible)
              for label in ("LIBRUS Synergia","Synergia"):
                  try:
                      v=page.get_by_text(label,exact=True).filter(visible=True)
                      if v.count():
                          v.first.click(timeout=2500)
                          page.wait_for_timeout(1500)
                          print("OPEN_MENU",label,"url",safeurl(page.url))
                          break
                  except Exception as e:
                      print("OPEN_MENU_FAILED",label,type(e).__name__)
              for label in ("Zaloguj","Zaloguj się"):
                  try:
                      v=page.get_by_text(label,exact=True)
                      if v.count():
                          v.first.click(timeout=2500)
                          page.wait_for_timeout(2500)
                          print("CLICK_LOGIN",label,"url",safeurl(page.url),"password_fields",page.locator('input[type="password"]').count())
                          break
                  except Exception as e:
                      print("CLICK_LOGIN_FAILED",label,type(e).__name__)
              print("FINAL",safeurl(page.url),"password_fields",page.locator('input[type="password"]').count())
              b.close()
          PY
