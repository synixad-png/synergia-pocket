name: Tests — Synergia Pocket

on:
  push:
    branches:
      - main
      - feature/session-continuity-no-phone-vault
      - feature/ios-webpush-v1
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Check Python syntax
        run: python -m compileall -q app.py session_store.py tests
      - name: Check frontend JavaScript syntax
        run: |
          for js in static/app.js static/messaging.js static/theme.js static/lesson-progress.js static/timetable-extras.js static/push.js static/school-files.js static/sw.js; do
            node --check "$js"
          done
      - name: Unit and regression tests (mock accounts only)
        run: python -m pytest -q
      - name: Install Chromium browser for visual contrast regression
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Check real dark/light text contrast on mobile and desktop
        run: python tests/browser_theme_check.py
      - name: Check school document download in real Chromium (mobile and desktop)
        run: python tests/browser_school_files_check.py
      - name: Build production Docker image and smoke test actual entrypoint
        run: |
          docker build --tag synergia-pocket:test .
          docker run --detach --name synergia-smoke --publish 127.0.0.1:18080:10000 synergia-pocket:test
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'; then
              docker rm -f synergia-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs synergia-smoke
          docker rm -f synergia-smoke
          exit 1
