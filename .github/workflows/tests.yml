name: Tests — Synergia Pocket

on:
  push:
    branches:
      - feature/session-continuity-no-phone-vault
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Check Python syntax
        run: python -m compileall -q app.py session_store.py tests
      - name: Check frontend JavaScript syntax
        run: node --check static/app.js
      - name: Unit and regression tests (mock accounts only)
        run: python -m pytest -q
