[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synergia-api-independent"
version = "0.2.0"
description = "Independent experimental async Python client for the unofficial Librus Synergia gateway"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
